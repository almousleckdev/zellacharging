server:
  port: ${PORT:${SERVER_PORT:8090}}

spring:
  application:
    name: ndzela-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/ndzela}
    username: ${DB_USER:ndzela}
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

ndzela:
  security:
    jwt-secret: ${NDZELA_JWT_SECRET}
    code-pepper: ${NDZELA_CODE_PEPPER}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins: 5
    lockout: 15m
  verification:
    code-ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
  mail-from: ${NDZELA_MAIL_FROM:no-reply@ndzela.local}
  ocpp:
    base-url: ${NDZELA_OCPP_BASE_URL:http://localhost:8080}
    api-key: ${NDZELA_OCPP_API_KEY}
  charging:
    plug-in-timeout: 60s
    sweep-interval: 15s
    stop-retry-after: 30s
    stop-threshold-percent: 95
    price-per-kwh-minor: ${NDZELA_PRICE_PER_KWH:}
  wallet:
    currency: ${NDZELA_WALLET_CURRENCY:XAF}
    decimals: 0
    minimum-start-minor: ${NDZELA_WALLET_MIN_START:1000}
    min-topup-minor: 500
    max-topup-minor: 500000
