spring:
  config:
    import: optional:file:./.env[.properties]
zella:
  rate-limit:
    login-per-ip-per-minute: 10000
    contact-per-ip-per-hour: 10000
    register-per-ip-per-hour: 10000
    resend-per-ip-per-hour: 10000
    verify-per-ip-per-minute: 10000
    refresh-per-ip-per-minute: 10000
    callback-per-ip-per-minute: 10000
    topup-per-customer-per-minute: 10000
    session-start-per-customer-per-minute: 10000
    withdrawal-per-customer-per-minute: 10000
  tenancy:
    require-restricted-role: false
  security:
    jwt-secret: dev-only-secret-change-me-0123456789abcdef0123456789
    code-pepper: dev-only-pepper
  admin:
    totp-key: dev-only-totp-passphrase-change-me-0123456789
  ocpp:
    require-secure-channel: false
    api-key: ${ZELLA_OCPP_API_KEY:${NDZELA_OCPP_API_KEY:dev-mobile-key-never-use-in-prod}}
  payment:
    provider: sandbox
    allow-sandbox: true
    reconcile-interval: 1h
  charging:
    user-refresh-interval: 0s
    metering-interval: 0s
    price-per-kwh-minor: 150
  wallet:
    ledger-check-interval: 1h
    currency: XOF
