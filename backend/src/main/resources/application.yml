server:
  port: ${PORT:${SERVER_PORT:8090}}
  forward-headers-strategy: native

spring:
  application:
    name: zella-backend
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 250ms
      connect-timeout: 500ms
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/zella}
    username: ${DB_USER:zella}
    password: ${DB_PASSWORD:dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:postgresql://localhost:5434/zella}
    user: ${DB_MIGRATION_USER:${DB_USER:zella}}
    password: ${DB_MIGRATION_PASSWORD:${DB_PASSWORD:dev}}
  messages:
    basename: errors
    encoding: UTF-8
    fallback-to-system-locale: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

zella:
  rate-limit:
    store: ${ZELLA_RATE_LIMIT_STORE:memory}
    login-per-ip-per-minute: 20
    contact-per-ip-per-hour: 5
    register-per-ip-per-hour: 10
    resend-per-ip-per-hour: 10
    verify-per-ip-per-minute: 30
    refresh-per-ip-per-minute: 60
    callback-per-ip-per-minute: 120
    topup-per-customer-per-minute: 10
    session-start-per-customer-per-minute: 10
    withdrawal-per-customer-per-minute: 5
  social:
    google-client-ids: ${ZELLA_GOOGLE_CLIENT_IDS:}
    apple-client-ids: ${ZELLA_APPLE_CLIENT_IDS:}
    apple-team-id: ${ZELLA_APPLE_TEAM_ID:}
    apple-key-id: ${ZELLA_APPLE_KEY_ID:}
    apple-private-key: ${ZELLA_APPLE_PRIVATE_KEY:}
  tenancy:
    default-country: ${ZELLA_DEFAULT_COUNTRY:${NDZELA_DEFAULT_COUNTRY:GA}}
    require-restricted-role: ${ZELLA_TENANCY_REQUIRE_RESTRICTED_ROLE:${NDZELA_TENANCY_REQUIRE_RESTRICTED_ROLE:true}}
    country-cache-ttl: 1m
  security:
    jwt-secret: ${ZELLA_JWT_SECRET:${NDZELA_JWT_SECRET}}
    code-pepper: ${ZELLA_CODE_PEPPER:${NDZELA_CODE_PEPPER}}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    max-failed-logins: 5
    lockout: 30m
  admin:
    bootstrap-email: ${ZELLA_ADMIN_EMAIL:}
    bootstrap-password: ${ZELLA_ADMIN_PASSWORD:}
    totp-key: ${ZELLA_ADMIN_TOTP_KEY}
    totp-issuer: Zella Charging
    mail-from: ${ZELLA_MAIL_FROM:${NDZELA_MAIL_FROM:no-reply@zella.local}}
    dashboard-url: ${ZELLA_ADMIN_DASHBOARD_URL:http://localhost:3000}
    invitation-ttl: 72h
    challenge-ttl: 5m
    access-token-ttl: 10m
    refresh-token-ttl: 12h
    max-failed-logins: 5
    lockout: 30m
  notifications:
    dispatch-interval: ${ZELLA_NOTIFICATION_INTERVAL:10s}
    batch-size: 50
    max-attempts: 6
    retry-base: 30s
    retention: 30d
    fcm:
      credentials-json: ${ZELLA_FCM_CREDENTIALS_JSON:}
      android-channel: zella_alerts
  verification:
    code-ttl: 5m
    resend-cooldown: 60s
    max-attempts: 5
  mail-from: ${ZELLA_MAIL_FROM:${NDZELA_MAIL_FROM:no-reply@zella.local}}
  ocpp:
    base-url: ${ZELLA_OCPP_BASE_URL:${NDZELA_OCPP_BASE_URL:http://localhost:8080}}
    api-key: ${ZELLA_OCPP_API_KEY:${NDZELA_OCPP_API_KEY}}
    signing-secret: ${ZELLA_OCPP_SIGNING_SECRET:${NDZELA_OCPP_SIGNING_SECRET:}}
    require-secure-channel: ${ZELLA_OCPP_REQUIRE_SECURE_CHANNEL:${NDZELA_OCPP_REQUIRE_SECURE_CHANNEL:true}}
    requests-per-minute: ${ZELLA_OCPP_REQUESTS_PER_MINUTE:${NDZELA_OCPP_REQUESTS_PER_MINUTE:55}}
    priority-reserve: 10
  ocpp-webhook:
    secret: ${ZELLA_OCPP_WEBHOOK_SECRET:${OCPP_WEBHOOK_SECRET:}}
    tolerance: 300s
  charging:
    plug-in-timeout: ${ZELLA_PLUG_IN_TIMEOUT:5m}
    sweep-interval: 15s
    stop-retry-after: 30s
    stop-threshold-percent: 100
    stop-lead-time: ${ZELLA_STOP_LEAD_TIME:45s}
    user-refresh-interval: 5s
    metering-interval: 10s
    stall:
      after: ${ZELLA_STALL_AFTER:5m}
      silent-after: ${ZELLA_SILENT_AFTER:40s}
    price-per-kwh-minor: ${ZELLA_PRICE_PER_KWH:${NDZELA_PRICE_PER_KWH:}}
  fees:
    vat-percent: ${ZELLA_VAT_PERCENT:${NDZELA_VAT_PERCENT:0}}
    service-fee-percent: ${ZELLA_SERVICE_FEE_PERCENT:${NDZELA_SERVICE_FEE_PERCENT:2}}
  support:
    email: ${ZELLA_SUPPORT_EMAIL:${NDZELA_SUPPORT_EMAIL:}}
    phone: ${ZELLA_SUPPORT_PHONE:${NDZELA_SUPPORT_PHONE:}}
    whatsapp: ${ZELLA_SUPPORT_WHATSAPP:${NDZELA_SUPPORT_WHATSAPP:}}
    agreement-url: ${ZELLA_AGREEMENT_URL:${NDZELA_AGREEMENT_URL:}}
    contact-inbox: ${ZELLA_CONTACT_INBOX:}
  payment:
    provider: ${ZELLA_PAYMENT_PROVIDER:${NDZELA_PAYMENT_PROVIDER:pvit}}
    allow-sandbox: ${ZELLA_PAYMENT_ALLOW_SANDBOX:${NDZELA_PAYMENT_ALLOW_SANDBOX:false}}
    recheck-after: 3m
    expire-after: 30m
    late-window: 6h
    reconcile-interval: 60s
    pvit:
      base-url: ${PVIT_BASE_URL:https://api.mypvit.pro}
      compte-operation-airtel: ${PVIT_COMPTE_OPERATION_AIRTEL:}
      compte-operation-moov: ${PVIT_COMPTE_OPERATION_MOOV:}
      secret-password: ${PVIT_SECRET_PASSWORD:}
      code-url-secret: ${PVIT_CODE_URL_SECRET:}
      code-url-payment: ${PVIT_CODE_URL_PAYMENT:}
      code-url-status: ${PVIT_CODE_URL_STATUS:}
      code-url-payout: ${PVIT_CODE_URL_PAYOUT:}
      code-url-kyc: ${PVIT_CODE_URL_KYC:}
      callback-url-code: ${PVIT_CALLBACK_URL_CODE:}
      agent: ${PVIT_AGENT:}
      product: ${PVIT_PRODUCT:}
      owner-charge: ${PVIT_OWNER_CHARGE:CUSTOMER}
      request-timeout: 20s
  wallet:
    currency: ${ZELLA_WALLET_CURRENCY:${NDZELA_WALLET_CURRENCY:XAF}}
    decimals: 0
    minimum-start-minor: ${ZELLA_WALLET_MIN_START:${NDZELA_WALLET_MIN_START:200}}
    maximum-start-minor: ${ZELLA_WALLET_MAX_START:${NDZELA_WALLET_MAX_START:200000}}
    ledger-check-interval: 10m
    withdrawal:
      enabled: ${ZELLA_WITHDRAWALS_ENABLED:${NDZELA_WITHDRAWALS_ENABLED:false}}
      minimum-minor: 200
      maximum-minor: 200000
      daily-maximum-minor: 500000
      recheck-after: 2m
      review-after: 2h
    min-topup-minor: 200
    max-topup-minor: 500000
  partner:
    rate-per-minute: ${ZELLA_PARTNER_RATE_PER_MINUTE:120}
    max-lookup-batch: 200
    default-feed-limit: 100
    max-feed-limit: 500
    feed-lag: ${ZELLA_PARTNER_FEED_LAG:10s}
