services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: zella
      POSTGRES_USER: zella
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - zella-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zella"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILDEV_PORT:-1080}:1080"

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zella
      DB_USER: zella
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: maildev
      MAIL_PORT: 1025
      ZELLA_JWT_SECRET: ${ZELLA_JWT_SECRET:?ZELLA_JWT_SECRET is required}
      ZELLA_CODE_PEPPER: ${ZELLA_CODE_PEPPER:?ZELLA_CODE_PEPPER is required}
      ZELLA_OCPP_BASE_URL: ${ZELLA_OCPP_BASE_URL:?ZELLA_OCPP_BASE_URL is required}
      ZELLA_OCPP_API_KEY: ${ZELLA_OCPP_API_KEY:?ZELLA_OCPP_API_KEY is required}
      ZELLA_OCPP_SIGNING_SECRET: ${ZELLA_OCPP_SIGNING_SECRET:-}
      ZELLA_OCPP_REQUIRE_SECURE_CHANNEL: ${ZELLA_OCPP_REQUIRE_SECURE_CHANNEL:-false}
      ZELLA_PAYMENT_ALLOW_SANDBOX: ${ZELLA_PAYMENT_ALLOW_SANDBOX:-true}
      ZELLA_WALLET_CURRENCY: ${ZELLA_WALLET_CURRENCY:-XAF}
      ZELLA_PRICE_PER_KWH: ${ZELLA_PRICE_PER_KWH:-}
      ZELLA_PAYMENT_PROVIDER: sandbox
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  zella-pg:
  caddy-data:
