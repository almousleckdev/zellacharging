services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: zella
      POSTGRES_USER: zella
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - zella-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zella"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

volumes:
  zella-pg:
