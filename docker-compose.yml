services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ndzela
      POSTGRES_USER: ndzela
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ndzela-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ndzela"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

volumes:
  ndzela-pg:
